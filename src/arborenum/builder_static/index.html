    }

      margin: 0 0 10px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .threshold-interval-list {
      display: grid;
      gap: 8px;
    }

    .threshold-interval-button {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid #b9d7ee;
      border-left: 5px solid #0072b2;
      border-radius: 13px;
      background: #f8fcff;
      color: #102033;
      text-align: left;
      cursor: pointer;
      transition: background .14s ease, border-color .14s ease, transform .14s ease;
    }

    .threshold-interval-button:hover {
      background: #eef8ff;
      border-color: #7eb7dc;
      transform: translateY(-1px);
    }

    .threshold-interval-range,
    .threshold-interval-detail-title {
      min-width: 0;
      font-size: 14px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .threshold-interval-sub,
    .threshold-interval-detail-sub {
      margin-top: 3px;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
    }

    .threshold-interval-count {
      padding: 4px 8px;
      border-radius: 999px;
      background: #e6f4fc;
      color: #005f94;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .threshold-interval-empty {
      padding: 12px;
      border: 1px solid #dbe4ee;
      border-radius: 12px;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .threshold-interval-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .threshold-interval-detail-copy { min-width: 0; }

      min-height: 31px;
      padding: 0 10px;

      border-radius: 10px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
    }

      display: grid;

      padding: 9px 10px;
      border: 1px solid #dbe4ee;
      border-radius: 11px;
      background: #fff;
      color: #102033;
      text-align: left;
      cursor: pointer;
      transition: background .14s ease, border-color .14s ease, transform .14s ease;

    .threshold-cut-button:hover {

    .arborenum-hidden-control { display: none !important; }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: end;
      gap: 7px 9px;
    }

    #${ME} {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    #${ME} .ghost-button {
      min-width: 104px;
      white-space: nowrap;
    }

    .favorite-star-active {
      border-color: #e3bd4c !important;
      background: #fffaf0 !important;
      color: #7a5200 !important;
    }

    .starred-tree-count {
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff4cf;
      color: #8b5d00;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
    }

    .toolbar-row { grid-template-columns: repeat(3, 1fr) !important; }

    .arborenum-completion-label {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 1px 2px 2px;
      order: 0;
    }

    .arborenum-completion-label b {
      color: #334155;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .arborenum-completion-label span {
      color: #94a3b8;
      font-size: 9px;
      font-weight: 750;
    }

    .arborenum-completion-optimal { order: 1; }
    .arborenum-completion-random { order: 2; }
    .arborenum-completion-constrained { order: 3; }

    .favorites-toast {
      position: fixed;
      z-index: 12000;
      top: 24px;
      left: 50%;
      transform: translate(-50%, -8px);
      padding: 10px 15px;
      border: 1px solid #d8e3ed;
      border-radius: 11px;
      background: rgba(255,255,255,0.97);
      color: #334155;
      box-shadow: 0 12px 34px rgba(15,23,42,0.17);
      font-size: 13px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .favorites-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .starred-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(15, 23, 42, 0.34);
      backdrop-filter: blur(4px);
    }

    .starred-gallery {
      width: min(1040px, calc(100vw - 56px));
      max-height: min(800px, calc(100vh - 56px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #d7e1eb;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 28px 90px rgba(15, 23, 42, 0.28);
    }

    .starred-gallery-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px 16px;
      border-bottom: 1px solid #e8eef5;
    }

    .starred-gallery-head-copy { display: grid; gap: 4px; }
    .starred-gallery-head-copy b { color: #17263a; font-size: 18px; }
    .starred-gallery-head-copy span { color: #66788d; font-size: 11px; line-height: 1.4; }

    .starred-gallery-head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .starred-gallery-export,
    .starred-gallery-close,
    .starred-export-action,
    .starred-export-cancel {
      min-height: 34px;
      border: 1px solid #e0e5d7;
      border-radius: 10px;
      background: #f7f9fc;
      color: #40546a;
      cursor: pointer;
      padding: 0 11px;
      font-size: 11px;
      font-weight: 850;
    }

    .starred-gallery-close {
      width: 34px;
      padding: 0;
      color: #607086;
      font-size: 20px;
      line-height: 1;
    }

    .starred-export-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid #e8eef5;
      background: #fffdf7;
    }

    .starred-export-select-all {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
    }

    .starred-export-count {
      margin-right: auto;
      color: #879180;
      font-size: 12px;
      font-weight: 750;
    }

    .starred-export-action {
      border-color: #82afd0;
      background: #eef7fd;
      color: #075f93;
    }

    .starred-export-action:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .starred-gallery-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 14px;
      overflow-y: auto;
      padding: 18px 20px 22px;
      background: #f7f9fc;
      scrollbar-gutter: stable;
    }

    .starred-gallery-empty {
      grid-column: 1 / -1;
      min-height: 290px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 1px dashed #bfd0df;
      border-radius: 15px;
      background: #ffffff;
      color: #8a9bae;
      text-align: center;
      font-size: 12px;
      line-height: 1.55;
    }

    .starred-tree-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #d8e3ed;
      border-radius: 15px;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .starred-tree-card:hover {
      transform: translateY(-3px);
      border-color: #dfb43d;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.13);
    }

    .starred-tree-card.current {
      border-color: #5c9dcc;
      box-shadow: 0 0 0 2px rgba(0,114,178,.10), 0 9px 25px rgba(15,23,42,.08);
    }

    .starred-tree-card.export-selected {
      border-color: #d7aa2d;
      box-shadow: 0 0 0 2px rgba(215,170,45,.14), 0 9px 25px rgba(15,23,42,.08);
    }

    .starred-tree-select {
      position: absolute;
      z-index: 3;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      accent-color: #b78300;
    }

    .starred-tree-visual {
      position: relative;
      height: 116px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid #eaf0f5;
      background: linear-gradient(180deg,#f5f9fc 0%,#fff 100%);
    }

    .starred-tree-thumbnail { width: 94%; height: 100px; overflow: visible; }
    .starred-thumb-edge { stroke: #9fb3c7; stroke-width: 2.3; stroke-linecap: round; }
    .starred-thumb-node { stroke: #fff; stroke-width: 1.6; }
    .starred-thumb-split { fill: #4f8bb8; }
    .starred-thumb-leaf { fill: #67a77d; }
    .starred-thumb-choice { fill: #d49a26; }

    .starred-tree-number,
    .starred-tree-current-badge {
      position: absolute;
      top: 9px;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 900;
    }

    .starred-tree-number { left: 9px; background: #fff4cf; color: #855800; }
    .starred-tree-current-badge { right: 9px; background: #e4f1fa; color: #00679d; }
    .starred-tree-card.export-mode .starred-tree-current-badge { right: 38px; }

    .starred-tree-card-body { display: grid; gap: 8px; padding: 12px; }

    .starred-tree-name {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 5px 6px;
      margin: -5px -6px 0;
      background: transparent;
      color: #25364a;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }

    .starred-tree-name:hover,
    .starred-tree-name:focus {
      outline: none;
      border-color: #cbd9e7;
      background: #f7fafc;
    }

    .starred-tree-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .starred-tree-status {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .starred-tree-status.partial { background: #fff4cf; color: #855800; }
    .starred-tree-status.complete { background: #e7f6ec; color: #24713c; }
    .starred-tree-time { color: #99a7b6; font-size: 8px; font-weight: 750; white-space: nowrap; }

    .starred-tree-summary {
      color: #5f7185;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.4;
    }

    .starred-tree-summary.partial { color: #7d8997; font-weight: 850; }

    .starred-tree-rules {
      display: grid;
      gap: 3px;
      min-height: 42px;
      padding-top: 7px;
      border-top: 1px solid #edf2f7;
    }

    .starred-tree-rules-title {
      color: #8b99a8;
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .starred-tree-rule {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #40546a;
      font-size: 9px;
      font-weight: 780;
    }

    .starred-tree-rule-more { color: #94a3b8; font-size: 8px; font-weight: 800; }

    .starred-tree-actions {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 7px;
      opacity: .72;
      transition: opacity .16s ease;
    }

    .starred-tree-card:hover .starred-tree-actions,
    .starred-tree-card.current .starred-tree-actions { opacity: 1; }

    .starred-tree-open-card,
    .starred-tree-delete {
      min-height: 32px;
      border: 1px solid #d7e2ec;
      border-radius: 9px;
      background: #f7fafc;
      color: #40546a;
      cursor: pointer;
      font-size: 9px;
      font-weight: 850;
    }

    .starred-tree-open-card:hover:not(:disabled) {
      border-color: #79add2;
      background: #edf7fd;
      color: #075f93;
    }

    .starred-tree-open-card:disabled { cursor: default; color: #6f8398; background: #f2f6f9; }
    .starred-tree-delete { width: 34px; background: #fff; color: #98a5b3; font-size: 15px; }
    .starred-tree-delete:hover { border-color: #fecaca; background: #fff6f6; color: #b42318; }

    @media (max-width: 900px) {
      .starred-gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .starred-overlay { padding: 12px; }
      .starred-gallery { width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
      .starred-gallery-grid { grid-template-columns: 1fr; padding: 12px; }
      .starred-export-toolbar { flex-wrap: wrap; }
